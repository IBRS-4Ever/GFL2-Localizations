GFL2.URNC_Arges.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for high-firepower weapons such as submachine guns and and light machine guns. When this thing shows up as fire support, all hope of the engagement ending cleanly goes out the window.\n\nOf course it can illuminate an area. With its continual muzzle flash, of course.
GFL2.URNC_Brontes.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for short range weapons such as pistols and flamethrowers You'll find no finer replacement for human soldiers in a defensive battle.\n\nIn order to adapt to technological advancements, it's made preparations for CQC.
GFL2.URNC_Jord.Description=An iteration upon the "Cyclops" model with further specialization, using the Brontes, Steropes, and Arges models as a basis. Equipped with flamethrowers and other implements of suppressive fire. Boasts impressive firepower, but lacks operational endurance and requires the support of other models.\n\nThere are very few things that can't be put to the torch. If it doesn't work, add another torch.
GFL2.URNC_Steropes.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for long range weapons such as sniper rifles and grenade launchers. Defensive capabilities have been sacrificed for superior mobility.\n\nHigh-voltage hazard. Exercise caution.
GFL2.URNC_Surtr.Description=An iteration upon the "Cyclops" model with further specialization, using the Brontes, Steropes, and Arges models as a basis. Equipped with target painters and other tactical equipment. more versatile in application tan other models, and more specialized in use.\n\nNo matter the season, this'll be hot.

# Surveying Team
GFL2.SurveyingTeam.PM=Girls Frontline 2 Scout Vanguard
GFL2.SurveyingTeam.NPC_F=Scout Vanguard (Friendly)
GFL2.SurveyingTeam.NPC_E=Scout Vanguard (Enemy)

GFL2.SurveyingTeam.Description=A human officer of the Scout Corps. Highly knowledgeable about the Contaminated Zone's topography due to long periods of deployment in scouting assignments, rectifying the downfalls created by outdated equipment. Resourceful and cautious, a geological expert any team would appreciate.\n\nThe finest tour guide in the Contaminated Zone. Don't mind it occasionally consuming a guest.

# Centaurus
GFL2.URNC_Centaurus.PM=Girls Frontline 2 Centaurus
GFL2.URNC_Centaurus.NPC_F=Centaurus (Friendly)
GFL2.URNC_Centaurus.NPC_E=Centaurus (Enemy)

GFL2.URNC_Centaurus.Description=A Military archer that has shed its armor. It pulls its compound bow to maximum draw and rains down hails of explosive arrows with its fragile body that has been lightened to the utmost.\n\nWithin five paces, the bow is swift, beyond five paces, the bow is accurate, and beyond 500 paces the bow is both swift and accurate!
