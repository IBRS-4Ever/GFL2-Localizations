# Paradeus Doll
GFL2.Paradeus_Doll_PM=Girls Frontline 2 Paradeus Doll

GFL2.Paradeus_Doll_NPC_F=Paradeus Doll (Friendly)
GFL2.Paradeus_Doll_NPC_E=Paradeus Doll (Enemy)

GFL2.Paradeus_Doll_Description=A Doll belonging to Paradeus, possessing great fighting power and excellent mission capabilities. Despite its monotonous attack methods, their powerful weapon components make them formidable foes. They fulfill their duties as defenders of the castle without questioning their presence here.\n\nThey might look familiar from just about every angle, but don't be mistaken.

# Mokosh
GFL2.Mokosh_Judge_PM=Girls Frontline 2 Oathsworn Judge
GFL2.Mokosh_Vanguard_PM=Girls Frontline 2 Oathsworn Vanguard
GFL2.Mokosh_Spec_Ops_PM=Girls Frontline 2 Oathsworn Spec Ops
GFL2.Mokosh_Support_PM=Girls Frontline 2 Oathsworn Support

GFL2.Mokosh_Judge_NPC_F=Oathsworn Judge (Friendly)
GFL2.Mokosh_Judge_NPC_E=Oathsworn Judge (Enemy)
GFL2.Mokosh_Vanguard_NPC_F=Oathsworn Vanguard (Friendly)
GFL2.Mokosh_Vanguard_NPC_E=Oathsworn Vanguard (Enemy)
GFL2.Mokosh_Spec_Ops_NPC_F=Oathsworn Spec Ops (Friendly)
GFL2.Mokosh_Spec_Ops_NPC_E=Oathsworn Spec Ops (Enemy)
GFL2.Mokosh_Support_NPC_F=Oathsworn Support (Friendly)
GFL2.Mokosh_Support_NPC_E=Oathsworn Support (Enemy)

GFL2.Mokosh_Judge_Description=An officer among the Mokosh Oathsworn. They are accomplished warriors and possess exceptional tactical skills. They report directly to the highest authority of Mokosh and oversee the battlefield, directing various forces during operations. They are also capable of fighting in urban combat environments and quelling small-scale insurgencies. Oathsworn Arbitrators are not just respected, they are feared. Without their loyalty, they are nothing.\n\nBattlefield judgement complete. You have the right to remain silent, but the noise you made is loud enough as it is.
GFL2.Mokosh_Vanguard_Description=These frontliners among the Oathsworn are responsible for suppressing riots and are largely composed of local militiamen. They primarily use numbers to make a chance for themselves for them to seize victory in close combat. Their gear is more valuable than their lives.\n\nWho says cannon fodder can't have dreams? At the very least, climbing the ranks through their achievements isn't wishful thinking for them.
GFL2.Mokosh_Spec_Ops_Description=Elite members of their Oathsworn, their equipment is better, their wills are stronger, and their careers are completely stagnated. They handle fire support among Oathsworn fireteams and boast excellent ranged combat abilities as well as a cruel, ruthless fighting style. One could say they are fanatics who represent Mokosh's ideology.\n\nDon't question their loyalty; they won't hesitate to show you its power.
GFL2.Mokosh_Support_Description=They handle logistics and medical duties in Oathsworn combat teams. Primarily composed of the elderly and veterans. While they have a limited ability to defend themselves, they're always the first to flee when trouble rears its ugly head.\n\nUsually, they're capable of helping their friends out, but when push comes to shove, they're nowhere to be found.

