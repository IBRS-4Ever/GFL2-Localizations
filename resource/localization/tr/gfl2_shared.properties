GFL2.URNC_Arges.NPC_F=Arges (Dost)
GFL2.URNC_Arges.NPC_E=Arges (Düşman)
GFL2.URNC_Brontes.NPC_F=Brontes (Dost)
GFL2.URNC_Brontes.NPC_E=Brontes (Düşman)
GFL2.URNC_Jord.NPC_F=Jord (Dost)
GFL2.URNC_Jord.NPC_E=Jord (Düşman)
