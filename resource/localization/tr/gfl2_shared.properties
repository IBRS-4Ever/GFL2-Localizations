GFL2.URNC_Steropes.NPC_E=Steropes (Düşman)
GFL2.URNC_Surtr.NPC_F=Surtr (Dost)
GFL2.URNC_Surtr.NPC_E=Surtr (Düşman)

GFL2.URNC_Arges.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for high-firepower weapons such as submachine guns and and light machine guns. When this thing shows up as fire support, all hope of the engagement ending cleanly goes out the window.\n\nOf course it can illuminate an area. With its continual muzzle flash, of course.
GFL2.URNC_Brontes.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for short range weapons such as pistols and flamethrowers You'll find no finer replacement for human soldiers in a defensive battle.\n\nIn order to adapt to technological advancements, it's made preparations for CQC.
GFL2.URNC_Jord.Description=An iteration upon the "Cyclops" model with further specialization, using the Brontes, Steropes, and Arges models as a basis. Equipped with flamethrowers and other implements of suppressive fire. Boasts impressive firepower, but lacks operational endurance and requires the support of other models.\n\nThere are very few things that can't be put to the torch. If it doesn't work, add another torch.
GFL2.URNC_Steropes.Description=An iteration upon the "Cyclops" model with additional special adaptive modules for long range weapons such as sniper rifles and grenade launchers. Defensive capabilities have been sacrificed for superior mobility.\n\nHigh-voltage hazard. Exercise caution.
GFL2.URNC_Surtr.Description=An iteration upon the "Cyclops" model with further specialization, using the Brontes, Steropes, and Arges models as a basis. Equipped with target painters and other tactical equipment. more versatile in application tan other models, and more specialized in use.\n\nNo matter the season, this'll be hot.

# Surveying Team
GFL2.SurveyingTeam.PM=Girls Frontline 2 Scout Vanguard
GFL2.SurveyingTeam.NPC_F=Scout Vanguard (Dost)
GFL2.SurveyingTeam.NPC_E=Scout Vanguard (Düşman)

GFL2.SurveyingTeam.Description=İzci Birliğinin bir insan subayı. Keşif görevlerinde uzun süre konuşlandırılması ve modası geçmiş ekipmanların yarattığı düşüşleri düzeltmesi nedeniyle Kirlenmiş Bölgenin topografyası hakkında son derece bilgili. Becerikli ve temkinli, her ekibin takdir edeceği bir jeoloji uzmanı.\n\nThe finest tour guide in the Contaminated Zone. Don't mind it occasionally consuming a guest.

# Centaurus
GFL2.URNC_Centaurus.PM=Girls Frontline 2 Centaurus
GFL2.URNC_Centaurus.NPC_F=Centaurus (Dost)
GFL2.URNC_Centaurus.NPC_E=Centaurus (Düşman)

GFL2.URNC_Centaurus.Description=A Military archer that has shed its armor. It pulls its compound bow to maximum draw and rains down hails of explosive arrows with its fragile body that has been lightened to the utmost.\n\nWithin five paces, the bow is swift, beyond five paces, the bow is accurate, and beyond 500 paces the bow is both swift and accurate!

# Neobrute
GFL2.Neobrute_BladeRunner.PM=Girls Frontline 2 Edgewalker
GFL2.Neobrute_PrecisionPulse.PM=Girls Frontline 2 Precision Pulse
GFL2.Neobrute_Stormhunter.PM=Girls Frontline 2 Stormhunter
GFL2.Neobrute_BladeRunner.NPC_F=Edgewalker (Dost)
GFL2.Neobrute_BladeRunner.NPC_E=Edgewalker (Düşman)
GFL2.Neobrute_PrecisionPulse.NPC_F=Precision Pulse (Dost)
GFL2.Neobrute_PrecisionPulse.NPC_E=Precision Pulse (Düşman)
GFL2.Neobrute_Stormhunter.NPC_F=Stormhunter (Dost)
GFL2.Neobrute_Stormhunter.NPC_E=Stormhunter (Düşman)

GFL2.Neobrute_BladeRunner.Description=A mass-produced Marionette Doll that only knows how to fight and obey, its specialized movement modules allow it to more easily hide, track and assassinate its prey.\n\nSo, which is faster within 7 paces, a gun or a blade?
GFL2.Neobrute_PrecisionPulse.Description=A mass-produced Marionette Doll that only knows how to fight and obey, skilled at eliminating enemies from a distance with precise gunfire.\n\nShh, I think the trees were speaking.
GFL2.Neobrute_Stormhunter.Description=A mass-produced Marionette Doll that only knows how to fight and obey, skilled at delivering big barrages of suppressive fire.\n\nNeed a powerbank?

# Neobrute - Premium Bodyguard
GFL2.Neobrute_PremiumBodyguard.PM=Girls Frontline 2 Premium Bodyguard
GFL2.Neobrute_PremiumBodyguard.NPC_F=Premium Bodyguard (Dost)
GFL2.Neobrute_PremiumBodyguard.NPC_E=Premium Bodyguard (Düşman)

GFL2.Neobrute_PremiumBodyguard.Description=A commercial-grade Doll produced by the Orlog Conglomerate. While their production costs are low, their prices are high. They are primarily used by wealthy merchants who lack the means to defend themselves. Though outfitted with relatively high-end combat systems to justify their inflated price tags, they lack the overall capacity to support these systems at full output, which has made them the butt of jokes among military experts.\n\nThe sole flaw with premium products is that their price tag is also premium.
