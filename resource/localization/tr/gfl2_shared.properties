GFL2.Mokosh_Support.NPC_E=Oathsworn Support (Düşman)

GFL2.Mokosh_Judge.Description=An officer among the Mokosh Oathsworn. They are accomplished warriors and possess exceptional tactical skills. They report directly to the highest authority of Mokosh and oversee the battlefield, directing various forces during operations. They are also capable of fighting in urban combat environments and quelling small-scale insurgencies. Oathsworn Arbitrators are not just respected, they are feared. Without their loyalty, they are nothing.\n\nBattlefield judgement complete. You have the right to remain silent, but the noise you made is loud enough as it is.
GFL2.Mokosh_Vanguard.Description=These frontliners among the Oathsworn are responsible for suppressing riots and are largely composed of local militiamen. They primarily use numbers to make a chance for themselves for them to seize victory in close combat. Their gear is more valuable than their lives.\n\nWho says cannon fodder can't have dreams? At the very least, climbing the ranks through their achievements isn't wishful thinking for them.
GFL2.Mokosh_Spec_Ops.Description=Elite members of their Oathsworn, their equipment is better, their wills are stronger, and their careers are completely stagnated. They handle fire support among Oathsworn fireteams and boast excellent ranged combat abilities as well as a cruel, ruthless fighting style. One could say they are fanatics who represent Mokosh's ideology.\n\nDon't question their loyalty; they won't hesitate to show you its power.
GFL2.Mokosh_Support.Description=They handle logistics and medical duties in Oathsworn combat teams. Primarily composed of the elderly and veterans. While they have a limited ability to defend themselves, they're always the first to flee when trouble rears its ugly head.\n\nUsually, they're capable of helping their friends out, but when push comes to shove, they're nowhere to be found.

