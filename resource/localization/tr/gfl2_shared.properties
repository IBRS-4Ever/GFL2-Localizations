GFL2.Paradeus_Sextans.Description=Mükemmel bir satranç oyuncusu, tahtadaki her şeyi kullanabilir — düşmanın taşları dahil.\n\nYou are 14 minutes and 25.31 seconds late.
GFL2.Paradeus_Lose_Sextans.Description=Adını unutmuş bir satranç oyuncusu eskiden olduğu gibi sakince hamlesini yapıp geleceğe dair karar verebilir mi?\n\nSöyle... bana... ben... kimim?

