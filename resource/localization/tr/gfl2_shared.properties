# Paradeus Doll
GFL2.Paradeus_Doll_PM=Girls Frontline 2 Paradeus Doll

GFL2.Paradeus_Doll_NPC_F=Paradeus Doll (Dost)
GFL2.Paradeus_Doll_NPC_E=Paradeus Doll (Düşman)

GFL2.Paradeus_Doll_Description=Paradus'a ait bir Bebek. Mükemmel dövüş gücüne ve eşsiz görev kabiliyetine sahip. Basit saldırı yöntemlerine rağmen güçlü silah parçaları onu hafife alınamayacak bir rakip haline getiriyor. Varlıklarını hiç sorgulamadan kaleyi koruma görevine devam ediyorlar.\n\nNereden bakarsanız bakın aynı görünebilirler fakat görünüşe aldanmayın.

