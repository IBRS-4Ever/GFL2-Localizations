GFL2.Darture.Description=Zarif dans hareketlerinin ve her duruma uygun taktikleri olduğu gibi bir hanımefendi için yüzünde çiçekler açarcasına gülümsemek çok basit bir yetenektir.\n\nThe ball has begun. I look forward to your performance, sir.

# Groza?
GFL2.Unknown_Groza.PM=Girls Frontline 2 Groza?
GFL2.Unknown_Groza.NPC_F=Groza? (Dost)
GFL2.Unknown_Groza.NPC_E=Groza? (Düşman)

GFL2.Unknown_Groza.Description=Yüksek düzeyde komuta yeteneklerine sahip gizemli bir düşman bebeği. Gövdesi, Elmo'daki Groza'ya çok benziyor, ancak bu tabanın üzerinde kapsamlı modül destekli yetenekler barındırıyor.\n\nA familiar face and form with a cool, detached attitude. Who is this person standing before us?

