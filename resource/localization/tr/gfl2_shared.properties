GFL2.Paradeus_Sextans_Description=Mükemmel bir satranç oyuncusu, tahtadaki her şeyi kullanabilir — düşmanın taşları dahil.\n\nYou are 14 minutes and 25.31 seconds late.
GFL2.Paradeus_Lose_Sextans_Description=Adını unutmuş bir satranç oyuncusu eskiden olduğu gibi sakince hamlesini yapıp geleceğe dair karar verebilir mi?\n\nSöyle... bana... ben... kimim?

# Shellcracker
GFL2.Shellcracker_NPC_E=Shellcracker

GFL2.Shellcracker.Description=A half-flora, half-fauna monster that has been severely mutated by Collapse Radiation. It boasts incredible destructive power and vitality and can shred armor with ease.\n\nThis thing... does it need sunlight and water?
