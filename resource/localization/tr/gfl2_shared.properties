GFL2.Mokosh_Judge.NPC_E=Oathsworn Judge (Düşman)
GFL2.Mokosh_Vanguard.NPC_F=Oathsworn Vanguard (Dost)
GFL2.Mokosh_Vanguard.NPC_E=Oathsworn Vanguard (Düşman)
GFL2.Mokosh_Spec_Ops.NPC_F=Oathsworn Spec Ops (Dost)
