GFL2.Igla.Description=Kıyafetleri zarif olduğu gibi kendisi de bir o kadar zarif 3. nesil bir Bebek. Ağırbaşlı görünümünün altında hayranlık uyandıran olağanüstü bir güç saklıyor.\n\nAs polite and composed as a funeral.

