GFL2.Aegis_SWAP_Artillery.Description=An upgraded version of the Aegis, essentially a mobile turret that prides itself on its cyclic rate and high firepower, ensuring victory for you and your team from the starting line.\n\nStart at range, seize the day!
GFL2.Aegis_SWAP_Bulwark.Description=An upgraded version of the Aegis. Its improvements are focused on its defensive systems, making it tougher and more durable, like what one would expect of the name "Bulwark".\n\nFull of security, full of love.
GFL2.Aegis_SWAP_Dominator.Description=One of the upgraded versions of the Aegis series, equipped with several Centralized Goliaths. Gain the powerful combination of Aegis and Goliath with just one small additional payment. Order now!\n\nAfter fighting, they can also come together to play poker.
GFL2.Aegis_SWAP_Myrmidon.Description=An upgraded version of the Aegis. It now focuses on variable attack methods, allowing it to choose from the best option to suit the field conditions. Ever-changing and dynamic, so just take your pick.\n\nThe Aegis Myrmidon, providing you with a professional and versatile solution to the enemy.

# Ateraxis
GFL2.Ateraxis.PM=Girls Frontline 2 Ateraxis
GFL2.Ateraxis.NPC_F=Ateraxis (Dost)
GFL2.Ateraxis.NPC_E=Ateraxis (Düşman)

GFL2.Ateraxis.Description=Caldwell tarafından geliştirilen, üçüncü nesil özel bir T-Doll'dur. Kendi hücreleri üzerinde mutlak kontrole sahiptir ve bunları dilediği gibi çeşitli ölümcül silahlara dönüştürerek savaşabilir. Son derece yüksek yıkıcı güce sahiptir. Karmaşık durumlarla karşılaştığında ise, çoğu zaman bir çocuğun saflığını andıran masum ama acımasız bir tavır sergiler.\n\n“Ablasını” yemeyi reddetmesinin nedeni, bir çocuk gibi yemek seçmesidir.

# Cocoon
GFL2.Cocoon.PM=Girls Frontline 2 Cocoon
GFL2.Cocoon.NPC_F=Cocoon (Dost)
GFL2.Cocoon.NPC_E=Cocoon (Düşman)

GFL2.Cocoon.Description=Görünürde nazik ama aslında çok soğuk bir Bebek. Bu 3. nesil Bebek istihbarat toplamada yetenekli ve harekete geçmeden önce strateji kurmayı seviyor. Düşmanın istihbaratını tamamen darmadağın ettikten sonra düşmanı adım adım işin içinden çıkılamaz bir duruma sokacak.\n\nI want to know all your secrets~

