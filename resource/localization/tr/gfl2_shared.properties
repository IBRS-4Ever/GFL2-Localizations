GFL2.ExecutionSquad_Blaster.Description=Demolitionists carrying varieties of equipment and explosives. Provides key support fire or cover, as well as clearing out paths of attack.	\n\nWas fined on many occasions for setting off fireworks in violation of regulations.
GFL2.ExecutionSquad_Flyer.Description=The main body of a squad's firepower. Capable of flexibly traversing long distances on the battlefield via flight and delivering a fatal blow.\n\nInsecticide will do little to them, but it's not like you need to bring out the big guns.
GFL2.ExecutionSquad_Mechanist.Description=Operations in the field, whether combat or logistical in nature, rely upon mecha-hounds. The mechanists carry upon them many maintenance toolboxes for this reason.\n\nWas fined on many occasions for walking a pet without a leash.
GFL2.ExecutionSquad_Strike_Captain.Description=Becoming a core officer of Mangi Security requires outstanding management and command abilities as well as personal prowess. A Strike Captain is an expert in combat at a variety of ranges and is highly adaptable in the field, posing a lethal threat to any enemy.\n\nNo one knew of his infiltration. No one alive, at least.

# Gaia & Theia
GFL2.Gaia.PM=Girls Frontline 2 Gaia
GFL2.Gaia.NPC_F=Gaia (Dost)
GFL2.Gaia.NPC_E=Gaia (Düşman)

GFL2.Theia.PM=Girls Frontline 2 Theia
GFL2.Theia.NPC_F=Theia (Dost)
GFL2.Theia.NPC_E=Theia (Düşman)

GFL2.Gaia.Description=A cheerful and keen Tactical Doll. As a corporate test subject, her neural cloud uses cutting edge technology. Her melee weapon skills are highly refined and she is very confident in her strength and speed. Her sheer strength devastates all goes.\n\nAs if your little sister would be that cute.
GFL2.Theia.Description=A rational and experienced Tactical Doll. As a corporate test subject, her neural cloud uses cutting-edge technology. She uses custom-made weaponry and practically no prey has been able to escape the dangerous webs of high energy beams that she spins.\n\nYou said there'd be no overtime; how could you lie to me like that?

